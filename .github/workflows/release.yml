name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0; leave blank to use pyproject.toml)'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: true

jobs:
  release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task sync

      - name: Run Quality Checks & Dataset Validation
        run: task check

      - name: Rebuild Fresh Pipeline Artifacts
        run: task pipeline

      - name: Determine Release Version & Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(python3 -c "import re, pathlib; print(re.search(r'version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text()).group(1))")
            TAG="v${VERSION}"
          fi
          DRAFT="${{ github.event.inputs.draft }}"
          if [ -z "$DRAFT" ]; then
            DRAFT="true"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"

      - name: Build Segmented Release Packages
        run: |
          task package -- --version "${{ steps.vars.outputs.tag }}"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          files: |
            dist/release/*.zip
            dist/release/*.tar.gz
            dist/release/*.whl
            dist/release/checksums.txt
            dist/release/manifest.json
          generate_release_notes: true
          draft: ${{ steps.vars.outputs.draft == 'true' }}
          prerelease: ${{ contains(steps.vars.outputs.tag, '-rc') || contains(steps.vars.outputs.tag, '-beta') || contains(steps.vars.outputs.tag, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Dataset to Hugging Face Hub
        if: env.HF_TOKEN != '' && steps.vars.outputs.draft != 'true'
        run: |
          task publish:hf
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

