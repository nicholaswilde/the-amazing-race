[project]
name = "the-amazing-race"
version = "0.5.0"
description = "A comprehensive tidy dataset and AI training corpus for the TV show The Amazing Race"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Nicholas Wilde", email = "nicholas@nicholaswilde.io" },
]
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "lxml>=5.2.0",
    "pandas>=2.2.2",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "pyreadr>=0.5.7",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
reddit = [
    "praw>=7.7.1",
]
sheets = [
    "gspread>=6.1.0",
    "openpyxl>=3.1.0",
]
hf = [
    "huggingface_hub>=0.23.0",
]
dev = [
    "coveralls>=4.1.0",
    "huggingface_hub>=0.23.0",
    "pytest>=8.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4.0",
]
dashboard = [
    "streamlit>=1.35.0",
]

[project.scripts]
tar-dataset = "tar_dataset.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tar_dataset"]

[tool.ruff.lint]
ignore = ["BLE001", "B008"]

[tool.coverage.run]
source = ["tar_dataset"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "coveralls>=4.1.0",
    "huggingface_hub>=0.23.0",
    "pytest-cov>=7.1.0",
]
