[files]
extend-exclude = [
  ".git/",
  ".venv/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".codegraph/",
  ".serena/cache/",
  "data/**",
  "htmlcov/",
  "uv.lock",
  "*.parquet",
  "*.db",
  "*.rds",
  "*.rda",
  "*.tar.gz",
  "*.zip",
  "*.geojson",
  "dev/images/**",
  "r/NAMESPACE",
]

[default.extend-words]
