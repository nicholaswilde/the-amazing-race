# https://taskfile.dev
version: '3'

dotenv: ['.env']

vars:
  PYTHON_FILES: src tests

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  # Dependency & Environment Management
  sync:
    desc: Sync dependencies including all extras via uv
    cmds:
      - uv sync --all-extras

  lock:
    desc: Lock project dependencies via uv
    cmds:
      - uv lock

  pipeline:
    desc: Rebuild all tidy tables, SQLite, Arrow, HuggingFace datasets, and AI corpora
    cmds:
      - task: build
      - task: export:arrow
      - task: export:ai
      - task: eval:benchmark
      - task: check

  # Code Quality & Testing
  test:
    desc: Run pytest test suite
    cmds:
      - uv run --extra dev pytest {{.CLI_ARGS}}

  test:coverage:
    desc: Run pytest test suite with branch test coverage
    cmds:
      - uv run --extra dev pytest --cov=tar_dataset --cov-report=term-missing --cov-report=xml --cov-report=lcov {{.CLI_ARGS}}

  coverage:report:
    desc: Generate HTML test coverage report in htmlcov/
    cmds:
      - uv run --extra dev pytest --cov=tar_dataset --cov-report=html

  coverage:upload:
    desc: Upload test coverage results to Coveralls.io
    cmds:
      - uv run --extra dev coveralls

  lint:
    desc: Lint Python source code with ruff
    cmds:
      - uv run ruff check {{.PYTHON_FILES}} {{.CLI_ARGS}}

  lint:fix:
    desc: Lint and fix issues with ruff
    cmds:
      - uv run ruff check --fix {{.PYTHON_FILES}} {{.CLI_ARGS}}

  format:
    desc: Format Python code with ruff
    cmds:
      - uv run ruff format {{.PYTHON_FILES}} {{.CLI_ARGS}}

  format:check:
    desc: Check formatting with ruff without modifying files
    cmds:
      - uv run ruff format --check {{.PYTHON_FILES}}

  check:
    desc: Run lint, format-check, test suite, and dataset validation
    cmds:
      - task: lint
      - task: test
      - task: validate

  # Data Processing & AI Corpora
  build:
    desc: Compile raw scraped and imported data into tidy CSV & Parquet tables
    cmds:
      - uv run tar-dataset build

  validate:
    desc: Validate processed datasets for schema and relational integrity
    cmds:
      - uv run tar-dataset validate

  stats:
    desc: Display row count statistics for all processed tables
    cmds:
      - uv run tar-dataset stats

  gaps:
    desc: Audit dataset completeness and identify missing cells and null rates
    cmds:
      - uv run tar-dataset gaps {{.CLI_ARGS}}

  export:ai:
    desc: Export datasets into AI training formats (JSONL fine-tuning & RAG corpus)
    cmds:
      - uv run tar-dataset export-ai

  export:sqlite:
    desc: Export processed tables into a unified SQLite database (data/processed/tar.db)
    cmds:
      - uv run tar-dataset export-sqlite

  export:arrow:
    desc: Export tables to Apache Arrow IPC files and HuggingFace Datasets layouts
    cmds:
      - uv run tar-dataset export-arrow

  eval:benchmark:
    desc: Run evaluation on The Amazing Race AI benchmark suite
    cmds:
      - uv run tar-dataset eval-benchmark

  # Data Ingestion & Scrapers
  scrape:wiki:
    desc: Scrape Wikipedia season tables, cast, results matrices, and leg summaries
    cmds:
      - uv run tar-dataset scrape-wiki {{.CLI_ARGS}}

  scrape:fandom:
    desc: Scrape Fandom Wiki for infoboxes and metadata
    cmds:
      - uv run tar-dataset scrape-fandom {{.CLI_ARGS}}

  scrape:reddit:
    desc: Fetch episode discussion threads from r/TheAmazingRace
    cmds:
      - uv run tar-dataset scrape-reddit {{.CLI_ARGS}}

  scrape:reddit:all:
    desc: Batch scrape all TAR discussion categories (episodes, live, post-episode, AMAs)
    cmds:
      - uv run tar-dataset scrape-reddit --batch {{.CLI_ARGS}}

  import:sheet:
    desc: Import community Google Sheet or external CSV table
    cmds:
      - uv run tar-dataset import-sheet {{.CLI_ARGS}}

  # CodeGraph Intelligence
  codegraph:sync:
    desc: Sync changes to the codegraph code intelligence index
    cmds:
      - codegraph sync

  codegraph:index:
    desc: Rebuild full codegraph index
    cmds:
      - codegraph index

  codegraph:status:
    desc: Show codegraph index status
    cmds:
      - codegraph status