# https://taskfile.dev
version: '3'

dotenv: ['.env']

vars:
  PYTHON_FILES: src tests

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  # Dependency & Environment Management
  sync:
    desc: Sync dependencies including all extras via uv
    cmds:
      - uv sync --all-extras

  lock:
    desc: Lock project dependencies via uv
    cmds:
      - uv lock

  pipeline:
    desc: Rebuild all tidy tables, SQLite, Arrow, HuggingFace datasets, and AI corpora
    cmds:
      - task: build
      - task: export:arrow
      - task: export:r
      - task: export:ai
      - task: export:geojson
      - task: eval:benchmark
      - task: check

  # Code Quality & Testing
  test:
    desc: Run pytest test suite
    cmds:
      - uv run --extra dev pytest {{.CLI_ARGS}}

  test:coverage:
    desc: Run pytest test suite with branch test coverage
    cmds:
      - uv run --extra dev pytest --cov=tar_dataset --cov-report=term-missing --cov-report=xml --cov-report=lcov {{.CLI_ARGS}}

  coverage:report:
    desc: Generate HTML test coverage report in htmlcov/
    cmds:
      - uv run --extra dev pytest --cov=tar_dataset --cov-report=html

  coverage:upload:
    desc: Upload test coverage results to Coveralls.io
    cmds:
      - uv run --extra dev coveralls

  lint:
    desc: Lint Python source code with ruff
    cmds:
      - uv run ruff check {{.PYTHON_FILES}} {{.CLI_ARGS}}

  lint:fix:
    desc: Lint and fix issues with ruff
    cmds:
      - uv run ruff check --fix {{.PYTHON_FILES}} {{.CLI_ARGS}}

  format:
    desc: Format Python code with ruff
    cmds:
      - uv run ruff format {{.PYTHON_FILES}} {{.CLI_ARGS}}

  format:check:
    desc: Check formatting with ruff without modifying files
    cmds:
      - uv run ruff format --check {{.PYTHON_FILES}}

  check:
    desc: Run lint, format-check, test suite, and dataset validation
    cmds:
      - task: lint
      - task: format:check
      - task: test
      - task: validate

  # Data Processing & AI Corpora
  build:
    desc: Compile raw scraped and imported data into tidy CSV & Parquet tables
    cmds:
      - uv run tar-dataset build

  validate:
    desc: Validate processed datasets for schema and relational integrity
    cmds:
      - uv run tar-dataset validate

  stats:
    desc: Display row count statistics for all processed tables
    cmds:
      - uv run tar-dataset stats

  predict:
    desc: Run empirical predictive engine on an upcoming or in-progress season
    cmds:
      - uv run tar-dataset predict {{.CLI_ARGS}}

  dashboard:
    desc: Launch interactive web dashboard for race exploration and predictions
    cmds:
      - uv run --extra dashboard tar-dataset dashboard {{.CLI_ARGS}}

  images:
    desc: Generate publication data visualisations and hex branding assets (dev/images/)
    cmds:
      - uv run --with matplotlib --with seaborn --with pillow --with pandas python dev/scripts/generate_images.py

  gaps:
    desc: Audit dataset completeness and identify missing cells and null rates
    cmds:
      - uv run tar-dataset gaps {{.CLI_ARGS}}

  export:ai:
    desc: Export datasets into AI training formats (JSONL fine-tuning & RAG corpus)
    cmds:
      - uv run tar-dataset export-ai

  export:sqlite:
    desc: Export processed tables into a unified SQLite database (data/processed/tar.db)
    cmds:
      - uv run tar-dataset export-sqlite

  export:arrow:
    desc: Export tables to Apache Arrow IPC files and HuggingFace Datasets layouts
    cmds:
      - uv run tar-dataset export-arrow

  export:r:
    desc: Export datasets to native R formats (.rds, .rda) and companion R package (r/)
    cmds:
      - uv run tar-dataset export-r

  export:geojson:
    desc: Export race routes and pit stop coordinates to GeoJSON (data/processed/tar_routes.geojson)
    cmds:
      - uv run tar-dataset export-geojson {{.CLI_ARGS}}

  eval:benchmark:
    desc: Run evaluation on The Amazing Race AI benchmark suite
    cmds:
      - uv run tar-dataset eval-benchmark

  publish:hf:
    desc: Publish and synchronize datasets and AI corpora to Hugging Face Hub
    cmds:
      - uv run tar-dataset publish-hf {{.CLI_ARGS}}

  # Release & Distribution Packaging
  package:
    desc: Build all release bundles (CSV, Parquet, AI, SQLite, R, Python, and checksums)
    cmds:
      - uv run tar-dataset package {{.CLI_ARGS}}

  package:csv:
    desc: Build tidy CSV release bundle (tar-dataset-csv.zip)
    cmds:
      - uv run tar-dataset package --component csv {{.CLI_ARGS}}

  package:parquet:
    desc: Build columnar Parquet release bundle (tar-dataset-parquet.zip)
    cmds:
      - uv run tar-dataset package --component parquet {{.CLI_ARGS}}

  package:ai:
    desc: Build AI training datasets release bundle (tar-dataset-ai.zip)
    cmds:
      - uv run tar-dataset package --component ai {{.CLI_ARGS}}

  package:r:
    desc: Build R companion source package tarball (theamazingrace_*.tar.gz)
    cmds:
      - uv run tar-dataset package --component r {{.CLI_ARGS}}

  package:python:
    desc: Build Python distribution wheels and source archive
    cmds:
      - uv run tar-dataset package --component python {{.CLI_ARGS}}

  package:tidytuesday:
    desc: Build R4DS TidyTuesday intake package bundle (tar-dataset-tidytuesday-*.zip)
    cmds:
      - uv run tar-dataset package --component tidytuesday {{.CLI_ARGS}}

  package:checksums:
    desc: Generate SHA-256 checksums file for release assets
    cmds:
      - uv run tar-dataset package --component checksums {{.CLI_ARGS}}

  release:
    desc: Automated release tagging, validation, and version bump (./scripts/release.sh)
    cmds:
      - ./scripts/release.sh {{.CLI_ARGS}}

  release:summary:
    desc: Generate categorized release notes and update draft release (./scripts/release_summary.py)
    cmds:
      - ./scripts/release_summary.py {{.CLI_ARGS}}


  # Data Ingestion & Scrapers
  scrape:wiki:
    desc: Scrape Wikipedia season tables, cast, results matrices, and leg summaries
    cmds:
      - uv run tar-dataset scrape-wiki {{.CLI_ARGS}}

  scrape:fandom:
    desc: Scrape Fandom Wiki for infoboxes and metadata
    cmds:
      - uv run tar-dataset scrape-fandom {{.CLI_ARGS}}

  scrape:reddit:
    desc: Fetch episode discussion threads from r/TheAmazingRace
    cmds:
      - uv run tar-dataset scrape-reddit {{.CLI_ARGS}}

  scrape:reddit:all:
    desc: Batch scrape all TAR discussion categories (episodes, live, post-episode, AMAs)
    cmds:
      - uv run tar-dataset scrape-reddit --batch {{.CLI_ARGS}}

  import:sheet:
    desc: Import community Google Sheet or external CSV table
    cmds:
      - uv run tar-dataset import-sheet {{.CLI_ARGS}}

  # Automated Ingestion & Scheduled Tracking
  ingest:check:
    desc: Check if new broadcast seasons or episodes are available on Wikipedia
    cmds:
      - ./scripts/schedule_ingest.py --check-only {{.CLI_ARGS}}

  ingest:run:
    desc: Ingest new seasons, recompile data pipeline, and update Issue #4
    cmds:
      - ./scripts/schedule_ingest.py {{.CLI_ARGS}}

  # CodeGraph Intelligence
  codegraph:sync:
    desc: Sync changes to the codegraph code intelligence index
    cmds:
      - codegraph sync

  codegraph:index:
    desc: Rebuild full codegraph index
    cmds:
      - codegraph index

  codegraph:status:
    desc: Show codegraph index status
    cmds:
      - codegraph status